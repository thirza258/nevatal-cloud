# Nevatal Cloud - Docker Compose base file (shared by every mode).
#
# Local development (simulated hypervisor + public demo accounts):
#
#   cp .env.example .env
#   docker compose up -d --build        # http://localhost:3080
#
# Servers: do not edit this file. Copy deploy/env/demo.env.example or
# deploy/env/production.env.example to .env and run ./deploy.sh. Those env
# files set COMPOSE_FILE, so the matching override in deploy/compose/ is also
# applied to plain `docker compose ps | logs | exec` run from the repo root.
#
# Requires Docker Compose v2.24+ (the overrides use the !reset YAML tag).
# Every value comes from .env; see .env.example for the full list.
#
# Optional services, enabled with COMPOSE_PROFILES (comma-separated):
#   tools   one-off migrate container (docker compose run --rm migrate)
#   edge    subdomain edge proxy for https://<name>.${PUBLIC_DOMAIN_ROOT}
#           (production only; never in demo)
#   tunnel  cloudflared, Cloudflare Tunnel connector (no inbound ports)
#   tls     Caddy with Let's Encrypt (defined in deploy/compose/{demo,production}.yml)
#   redis   Redis (not used by the application yet)

name: nevatal-cloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-database-url: &database-url "${EXTERNAL_DATABASE_URL:-postgres://${POSTGRES_USER:-nevatal}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-nevatal_cloud}?sslmode=disable}"

# Railway-style subdomains (https://<name>.${PUBLIC_DOMAIN_ROOT}), read by the
# API (claims, limits) and by the edge (routing). Empty PUBLIC_DOMAIN_ROOT =
# feature off; demo mode always forces it off. EDGE_PORT is fixed here because
# the healthcheck, cloudflared and the publish override expect 8088.
x-subdomain-env: &subdomain-env
  PUBLIC_DOMAIN_ROOT: ${PUBLIC_DOMAIN_ROOT:-}
  RESERVED_SUBDOMAINS: ${RESERVED_SUBDOMAINS:-}
  MAX_DOMAINS_PER_USER: ${MAX_DOMAINS_PER_USER:-5}
  DOMAIN_QUARANTINE_DAYS: ${DOMAIN_QUARANTINE_DAYS:-14}
  EDGE_TARGET_CIDRS: ${EDGE_TARGET_CIDRS:-}
  EDGE_DENY_IPS: ${EDGE_DENY_IPS:-}
  EDGE_PORT: "8088"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nevatal}
      # Only applied when the pgdata volume is initialised for the first time.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-nevatal_cloud}
    ports:
      # Loopback only (psql/GUI tools on the host). Removed in demo/production.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-nevatal-cloud-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *subdomain-env
      APP_ENV: ${APP_ENV:-development}
      # Empty = backend default (true unless APP_ENV=production).
      DEMO_MODE: ${DEMO_MODE:-}
      PORT: "8090"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DATABASE_URL: *database-url
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
      # AI orchestrator engine + provisioning-job durability (empty = code defaults,
      # see docs/ORCHESTRATOR.md section 4).
      ORCH_CONCURRENCY: ${ORCH_CONCURRENCY:-}
      ORCH_LEASE_SECONDS: ${ORCH_LEASE_SECONDS:-}
      ORCH_HEARTBEAT_SECONDS: ${ORCH_HEARTBEAT_SECONDS:-}
      ORCH_POLL_MS: ${ORCH_POLL_MS:-}
      ORCH_RETRY_BASE_MS: ${ORCH_RETRY_BASE_MS:-}
      # Phase 2–4 scheduled checks, automatic database backups, notification
      # retention and the advisor rate card (empty = code defaults).
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-}
      ORCH_DB_BACKUP_INTERVAL_SECONDS: ${ORCH_DB_BACKUP_INTERVAL_SECONDS:-}
      ORCH_NOTIFICATION_RETENTION_DAYS: ${ORCH_NOTIFICATION_RETENTION_DAYS:-}
      ORCH_COST_CURRENCY: ${ORCH_COST_CURRENCY:-}
      ORCH_COST_VCPU_MONTH: ${ORCH_COST_VCPU_MONTH:-}
      ORCH_COST_MEMORY_GB_MONTH: ${ORCH_COST_MEMORY_GB_MONTH:-}
      ORCH_COST_DISK_GB_MONTH: ${ORCH_COST_DISK_GB_MONTH:-}
      ORCH_COST_BUCKET_GB_MONTH: ${ORCH_COST_BUCKET_GB_MONTH:-}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-}
      JOB_STALE_AFTER_SECONDS: ${JOB_STALE_AFTER_SECONDS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_PATH: /data/storage
      PROXMOX_MOCK: ${PROXMOX_MOCK:-true}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_NODE_NAME: ${PROXMOX_NODE_NAME:-pve-dell-r640}
      PROXMOX_STORAGE: ${PROXMOX_STORAGE:-local-zfs}
      PROXMOX_VERIFY_TLS: ${PROXMOX_VERIFY_TLS:-false}
      WORDPRESS_API_KEY: ${WORDPRESS_API_KEY:-}
      WORDPRESS_URL: ${WORDPRESS_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TZ: ${TZ:-UTC}
    ports:
      # Development convenience only (loopback). Removed in demo/production.
      # Keep BACKEND_REPLICAS=1 while this port is published.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8090}:8090"
    volumes:
      # Local-disk object storage. Every replica on this host shares it.
      - storagedata:/data/storage
    # SIGTERM -> graceful shutdown; in-flight provisioning jobs need time.
    stop_grace_period: 60s
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    logging: *default-logging

  # One-off migration runner (the API also migrates at start-up):
  #   docker compose run --rm migrate                               # up
  #   docker compose run --rm migrate /app/nevatal-migrate version
  migrate:
    image: ${BACKEND_IMAGE:-nevatal-cloud-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-}
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    command: ["/app/nevatal-migrate", "up"]
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-nevatal-cloud-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx re-resolves this name every 5s and balances (least_conn) across
      # all backend replicas: docker compose up -d --scale backend=N
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8090}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-2g}
      NGINX_ISO_MAX_BODY_SIZE: ${NGINX_ISO_MAX_BODY_SIZE:-8g}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-3080}:8080"
    logging: *default-logging

  # Subdomain edge proxy (same image, /app/nevatal-edge): serves
  # https://<name>.${PUBLIC_DOMAIN_ROOT} by proxying to the private IP:port of
  # the customer VM that owns the name (routes are read from PostgreSQL).
  # Opt in with COMPOSE_PROFILES=edge (production; never in demo).
  #
  # Not published: cloudflared (profile "tunnel") reaches it as http://edge:8088
  # over the compose network. For a cloudflared or proxy OUTSIDE this stack,
  # append deploy/compose/edge-publish.yml to COMPOSE_FILE.
  #
  # The host must reach the customer VM network (a NIC on that bridge/VLAN or
  # a route), and EDGE_TARGET_CIDRS / EDGE_DENY_IPS must be set: see
  # docs/PROXMOX_INSTALL.md, section 20. The edge does not migrate the
  # database; the API and ./deploy.sh do.
  edge:
    image: ${BACKEND_IMAGE:-nevatal-cloud-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        VERSION: ${APP_VERSION:-}
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/nevatal-edge"]
    # Only what the edge needs: no JWT secret, no Proxmox token.
    environment:
      <<: *subdomain-env
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-}
      DATABASE_URL: *database-url
      # AdControl snippet injected into customer HTML pages (empty site key =
      # injection disabled). See docs/EDGE_ADS.md.
      ADCONTROL_SDK_URL: ${ADCONTROL_SDK_URL:-}
      ADCONTROL_SITE_KEY: ${ADCONTROL_SITE_KEY:-}
      ADCONTROL_PLACEMENT_KEY: ${ADCONTROL_PLACEMENT_KEY:-}
      TZ: ${TZ:-UTC}
    # SIGTERM -> stop accepting, drain in-flight requests.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8088/__edge/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *default-logging

  # Cloudflare Tunnel connector for a REMOTELY-MANAGED tunnel (hostnames and
  # their order are configured in the Cloudflare dashboard). Opt in with
  # COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN. Service URLs to enter
  # in the dashboard: http://frontend:8080 (control plane) and
  # http://edge:8088 (*.${PUBLIC_DOMAIN_ROOT}). No inbound port is needed.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.7}
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      # Only when the "edge" profile is enabled as well.
      edge:
        condition: service_started
        required: false
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # ./deploy.sh refuses to deploy the tunnel profile without it.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # Prometheus /metrics and /ready; published on host loopback only.
      TUNNEL_METRICS: 0.0.0.0:20241
      TUNNEL_LOGLEVEL: ${CLOUDFLARED_LOGLEVEL:-info}
    ports:
      - "127.0.0.1:${CLOUDFLARED_METRICS_PORT:-20241}:20241"
    healthcheck:
      # /ready answers 200 once at least one connection to Cloudflare is up.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    # cloudflared drains in-flight requests for 30s (--grace-period) on SIGTERM.
    stop_grace_period: 40s
    logging: *default-logging

  # Redis is not used by the application yet. Opt in with:
  #   COMPOSE_PROFILES=redis docker compose up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6385}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

volumes:
  pgdata:
  storagedata:
  redisdata:
