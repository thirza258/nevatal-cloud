# Reverse proxy settings for the Nevatal API (upstream nevatal_api is defined
# in default.conf). Included by the /api/ locations.

proxy_pass http://nevatal_api;
proxy_http_version 1.1;

# Upstream keepalive for normal requests (empty Connection header) while still
# passing WebSocket upgrades through ($connection_upgrade map in default.conf).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Keep the scheme seen by the outer TLS terminator (Caddy/HAProxy/Traefik).
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

proxy_cache_bypass $http_upgrade;

# Stream responses (logs, downloads) and request bodies (uploads) instead of
# spooling them to /tmp. With request buffering off nginx can only retry a
# request on another replica before the body has been sent, which is exactly
# what we want for uploads.
proxy_buffering off;
proxy_request_buffering off;

# Fail over quickly when a replica is down or restarting. nginx never retries
# non-idempotent requests (POST, PATCH, LOCK) unless "non_idempotent" is
# listed here - keep it that way so a VM is never created twice.
proxy_connect_timeout 2s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 15s;

# Long-lived connections: WebSocket consoles, log tails, large uploads.
proxy_send_timeout 600s;
proxy_read_timeout 86400s;
