# Security headers, included in every location of default.conf.
#
# nginx only inherits add_header directives from the enclosing level when a
# location defines none of its own, so this file is included explicitly in
# each location instead of relying on server-level inheritance.
#
# HSTS (Strict-Transport-Security) is intentionally NOT set here: it belongs
# at the TLS terminator (Caddy, HAProxy, Traefik) because this nginx speaks
# plain HTTP.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
