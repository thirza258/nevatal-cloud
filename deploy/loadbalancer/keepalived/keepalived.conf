# Nevatal Cloud - keepalived VRRP for two HAProxy VMs sharing one virtual IP.
#
# /etc/keepalived/keepalived.conf on lb1 (as below) and lb2 (swap the marked
# values). Clients and the DNS record use the VIP (10.0.0.10 here); when
# HAProxy or the whole VM on the active node fails, the VIP moves to the other.
#
# Requirements on both LB VMs:
#   apt install keepalived haproxy
#   HAProxy binds *:80 / *:443 (deploy/loadbalancer/haproxy/haproxy.cfg), so
#   it already accepts traffic for the VIP. If you bind HAProxy to the VIP
#   address itself, also set: sysctl -w net.ipv4.ip_nonlocal_bind=1
#   (persist in /etc/sysctl.d/99-nevatal-lb.conf).
#
# Proxmox specifics:
#   * Guest NICs are usually "ens18" (virtio) - check with `ip -br addr`.
#   * Proxmox firewall: allow IP protocol 112 (VRRP) between lb1 and lb2.
#   * If the VM NIC has the firewall "IP filter" option enabled, add the VIP
#     to the VM's ipfilter-net0 IP set, or the VIP traffic is dropped.
#
# Validate: keepalived -t -f /etc/keepalived/keepalived.conf

global_defs {
    router_id nevatal_lb1                 # lb2: nevatal_lb2
    enable_script_security
    script_user root
}

# The VIP only stays on a node whose HAProxy is running.
vrrp_script chk_haproxy {
    script "/usr/bin/systemctl is-active --quiet haproxy"
    interval 2
    fall 2
    rise 2
}

vrrp_instance VI_NEVATAL {
    state MASTER                          # lb2: BACKUP
    interface ens18
    virtual_router_id 51                  # same on both nodes, unique per LAN
    priority 150                          # lb2: 100
    advert_int 1

    # Unicast VRRP: works on networks/bridges that filter multicast.
    unicast_src_ip 10.0.0.5               # lb2: 10.0.0.6
    unicast_peer {
        10.0.0.6                          # lb2: 10.0.0.5
    }

    virtual_ipaddress {
        10.0.0.10/24 dev ens18
    }

    track_script {
        chk_haproxy
    }
}
