# Nevatal Cloud - HAProxy load balancer (topology B: N app VMs on Proxmox)
#
#   clients --HTTPS--> VIP (keepalived) --> HAProxy lb1/lb2
#                                             |  leastconn, /health checks
#                                             +--> app VM 1  nginx :3080 --> API replicas
#                                             +--> app VM 2  nginx :3080 --> API replicas
#
# Install on two small Debian/Ubuntu VMs (apt install haproxy keepalived) as
# /etc/haproxy/haproxy.cfg, then:  haproxy -c -f /etc/haproxy/haproxy.cfg
#                                  systemctl reload haproxy
# Works with HAProxy 2.6+ (Debian 12 ships 2.6, Ubuntu 24.04 ships 2.8).
#
# TLS: one PEM file = certificate chain + private key, readable only by root:
#   cat fullchain.pem privkey.pem > /etc/haproxy/certs/nevatal.pem
#   chmod 600 /etc/haproxy/certs/nevatal.pem
# (see docs/PROXMOX_INSTALL.md for certbot renewal through the ACME backend).
#
# On every app VM: .env with HTTP_BIND=<app VM LAN IP>, HTTP_PORT=3080, no
# COMPOSE_PROFILES=tls, APP_BASE_URL=https://<public host>, and a shared
# database + NFS storage (deploy/compose/multi-vm.yml).

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

    # Mozilla "intermediate" TLS profile.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout http-request 15s
    timeout http-keep-alive 15s
    timeout queue 30s
    # Inactivity timeouts. Uploads/downloads keep the connection active.
    timeout client 120s
    timeout server 300s
    # WebSocket consoles and log tails (after the HTTP upgrade).
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s

# Plain HTTP: ACME HTTP-01 challenges, everything else -> HTTPS.
frontend fe_http
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend be_acme if acme

frontend fe_https
    bind :443 ssl crt /etc/haproxy/certs/nevatal.pem alpn h2,http/1.1
    # HAProxy is the edge: drop client-supplied forwarding headers, then add
    # our own (option forwardfor in the backend).
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    # HSTS belongs at the TLS terminator.
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    default_backend be_nevatal

backend be_nevatal
    balance leastconn
    option forwardfor
    # Each check goes through nginx to an API replica on that VM.
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fastinter 2s downinter 10s fall 3 rise 2 maxconn 2000 check
    # One line per app VM (frontend nginx published on HTTP_BIND:HTTP_PORT).
    server app1 10.0.0.11:3080
    server app2 10.0.0.12:3080
    # server app3 10.0.0.13:3080

# certbot --standalone --http-01-port 8888 on this LB (see docs).
backend be_acme
    server certbot 127.0.0.1:8888

# Read-only statistics page, loopback only:
#   ssh -L 8404:127.0.0.1:8404 lb1   then open http://127.0.0.1:8404/stats
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
