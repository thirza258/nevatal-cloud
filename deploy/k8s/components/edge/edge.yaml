# Subdomain edge proxy: same image as the API, command /app/nevatal-edge.
#
# Least privilege: the edge gets only the settings it needs (no JWT secret,
# no Proxmox token), because it handles all internet traffic for tenant apps.
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: edge
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: edge
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nevatal-cloud
      app.kubernetes.io/component: edge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nevatal-cloud
        app.kubernetes.io/component: edge
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # preStop sleep (10s, endpoint propagation) + graceful drain of
      # in-flight requests on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nevatal-cloud
              app.kubernetes.io/component: edge
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nevatal-cloud
                    app.kubernetes.io/component: edge
      containers:
        - name: edge
          image: nevatal-cloud-backend
          imagePullPolicy: IfNotPresent
          command: ["/app/nevatal-edge"]
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: APP_ENV
            - name: DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: DEMO_MODE
            - name: PUBLIC_DOMAIN_ROOT
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: PUBLIC_DOMAIN_ROOT
            - name: RESERVED_SUBDOMAINS
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: RESERVED_SUBDOMAINS
            - name: MAX_DOMAINS_PER_USER
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: MAX_DOMAINS_PER_USER
            - name: DOMAIN_QUARANTINE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: DOMAIN_QUARANTINE_DAYS
            - name: EDGE_TARGET_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: EDGE_TARGET_CIDRS
            - name: EDGE_DENY_IPS
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: EDGE_DENY_IPS
            # AdControl injection; optional keys keep older ConfigMaps working.
            - name: ADCONTROL_SDK_URL
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: ADCONTROL_SDK_URL
                  optional: true
            - name: ADCONTROL_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: ADCONTROL_SITE_KEY
                  optional: true
            - name: ADCONTROL_PLACEMENT_KEY
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: ADCONTROL_PLACEMENT_KEY
                  optional: true
            # Fixed: the Service, the probes and cloudflared expect 8088.
            - name: EDGE_PORT
              value: "8088"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: TZ
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nevatal-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nevatal-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nevatal-secrets
                  key: POSTGRES_PASSWORD
            # $(VAR) references resolve against the variables defined above.
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          startupProbe:
            httpGet:
              path: /__edge/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /__edge/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /__edge/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the pod leaves the Service endpoints.
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
