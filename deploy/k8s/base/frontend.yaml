# Web control plane: nginx serving the SPA and proxying /api to the backend.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: nevatal-cloud
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nevatal-cloud
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nevatal-cloud
        app.kubernetes.io/component: frontend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid/gid 101 = "nginx" in nginxinc/nginx-unprivileged.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nevatal-cloud
              app.kubernetes.io/component: frontend
      containers:
        - name: frontend
          image: nevatal-cloud-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Must be a FQDN: nginx's resolver does not use resolv.conf
            # search domains. Change the namespace part if you rename it.
            - name: BACKEND_UPSTREAM
              value: backend.nevatal-cloud.svc.cluster.local:8090
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
          # Probe nginx itself, never /health: a backend outage must not
          # restart the frontends.
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # pid file + client/proxy temp paths of nginx-unprivileged
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            # The entrypoint renders /etc/nginx/templates/*.template here.
            - name: confd
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: confd
          emptyDir:
            sizeLimit: 1Mi
